# The gate that runs without being asked.
#
# Until this existed, `make check` and `make test` ran only when someone
# remembered, and the record of that is in the tree: a syntax error and a
# backend that could not be instantiated both survived seven months.
#
# The order is package first, then test what was packaged. A suite run against
# the working copy answers a question nobody asks -- nobody runs the working
# copy -- and it misses exactly the faults packaging introduces: a wheel that
# installed without its .ui files, a schema that never reached the compiled
# cache, an entry point that resolves to nothing. So the artefacts are built
# once, the suite runs against each of them installed, and those same files are
# what a release publishes.
#
# The Linux jobs run in Fedora containers rather than on ubuntu-latest, because
# GTK4, libadwaita and PyGObject have to come from a distribution that has them
# in the versions this targets. The Windows job answers the same question a
# different way -- there is no distribution there, so it carries the whole stack
# with it; see docs/WINDOWS.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml calls this, so a release is gated on the same jobs rather than
  # on a copy of them that drifts. The packages it uploads as artifacts are the
  # ones the release publishes -- built once, tested installed, then shipped.
  workflow_call:

permissions:
  contents: read

env:
  # Every target reuses the environment as-is; without this uv re-resolves it
  # and tries to build PyGObject and pycairo from source, which fails.
  UV_NO_SYNC: '1'
  # The runtime a GTK4 test needs on a machine with no GPU. libepoxy aborts
  # inside gdk_gl_context_make_current the moment a test presents a widget, and
  # takes the process down with it; conftest.py sets the same thing, and this is
  # here for anything run outside pytest.
  GSK_RENDERER: cairo

jobs:
  check:
    name: lint, format, types
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      # Every one of these jobs starts from a bare Fedora and installs its
      # tools before it can do anything, and dnf5 deletes the packages once it
      # has, so the next run downloads them all again. Keeping them and letting
      # the cache carry them between runs turns that into a copy.
      #
      # The key is unique per run and the restore key is the prefix, which is
      # the rolling form: every run restores the newest cache there is and
      # saves an updated one. Keyed on a hash of the package lists would be
      # tidier, but these steps have to come before the checkout -- the
      # checkout needs git-core, which is one of the packages -- and hashFiles
      # over an empty workspace returns the empty string, which would collapse
      # the key to a constant and never notice a list changing again.
      - name: keep downloaded packages
        run: echo "keepcache=True" >> /etc/dnf/dnf.conf

      - name: cache the packages
        uses: actions/cache@v4
        with:
          path: /var/cache/libdnf5
          key: dnf-44-${{ github.run_id }}
          restore-keys: dnf-44-

      - name: install dependencies
        run: |
          dnf -y --setopt=install_weak_deps=False install \
            make git-core uv python3-devel python3-gobject gtk4 libadwaita \
            gobject-introspection glib2-devel cairo-gobject-devel

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The checkout is owned by a different uid than the one running here, and
      # git refuses to read a repository it considers someone else's.
      # setuptools-scm shells out to git during the sync, so this comes first.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: make sync
      - run: make check

  distribution:
    name: build the wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # setuptools-scm reads the version out of git, and reads it wrong
          # without the tags and the history between them.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: build
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/*
          if-no-files-found: error

  rpm:
    name: build the rpm (fedora ${{ matrix.fedora }})
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest Fedora still supported, and the current one. A break
        # between them is almost always a GTK or PyGObject version difference,
        # which is exactly what a single-version run would hide.
        fedora: ['43', '44']
    steps:
      # Every one of these jobs starts from a bare Fedora and installs its
      # tools before it can do anything, and dnf5 deletes the packages once it
      # has, so the next run downloads them all again. Keeping them and letting
      # the cache carry them between runs turns that into a copy.
      #
      # The key is unique per run and the restore key is the prefix, which is
      # the rolling form: every run restores the newest cache there is and
      # saves an updated one. Keyed on a hash of the package lists would be
      # tidier, but these steps have to come before the checkout -- the
      # checkout needs git-core, which is one of the packages -- and hashFiles
      # over an empty workspace returns the empty string, which would collapse
      # the key to a constant and never notice a list changing again.
      - name: keep downloaded packages
        run: echo "keepcache=True" >> /etc/dnf/dnf.conf

      - name: cache the packages
        uses: actions/cache@v4
        with:
          path: /var/cache/libdnf5
          key: dnf-${{ matrix.fedora }}-${{ github.run_id }}
          restore-keys: dnf-${{ matrix.fedora }}-

      - name: install build dependencies
        run: |
          dnf -y --setopt=install_weak_deps=False install \
            git-core rpm-build rpmdevtools python3-devel python3-build \
            pyproject-rpm-macros desktop-file-utils libappstream-glib \
            glib2-devel

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Already inside the Fedora being built for, so this takes the direct path
      # rather than starting a container of its own.
      - name: build
        run: ./packaging/build-rpm.sh
        env:
          USE_CONTAINER: '0'
          FEDORA_RELEASE: ${{ matrix.fedora }}

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-fedora${{ matrix.fedora }}
          path: dist/rpm/*.rpm
          if-no-files-found: error

  deb:
    name: build the deb (${{ matrix.target }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # The two ends of what is supported, as the Fedora matrix is: Debian
        # trixie is the floor -- bookworm carries GTK 4.8 and the application
        # needs 4.10 -- and Ubuntu 26.04 is the current LTS, four libadwaita
        # releases ahead of it. A break between them is a GTK or PyGObject
        # version difference, which one target would hide.
        #
        # Ubuntu 24.04 is not here on purpose: its setuptools is too old to
        # parse the license metadata pyproject declares. docs/DEBIAN.md says
        # what that costs and why nothing in the packaging can fix it.
        include:
          - target: debian:trixie
            image: docker.io/library/debian:trixie
            id: debian-trixie
          - target: ubuntu:26.04
            image: docker.io/library/ubuntu:26.04
            id: ubuntu-26.04
    steps:
      # The apt counterpart of the dnf caching above: the archives are deleted
      # after installing by default, so without this every run downloads the
      # toolchain again. Same rolling key, and for the same reason -- these
      # steps come before the checkout, so hashing the package lists is not
      # available to key on.
      - name: keep downloaded packages
        run: |
          printf 'Binary::apt::APT::Keep-Downloaded-Packages "true";\n' \
            > /etc/apt/apt.conf.d/99keep-downloads

      - name: cache the packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: apt-${{ matrix.id }}-

      # Only what it takes to reach the build: git for the version, and the
      # three that build the sdist which is then packaged -- unisolated, so
      # setuptools and setuptools-scm come from apt rather than from PyPI. The
      # build dependencies proper are not listed here: debuild-here.sh installs
      # whatever dpkg-checkbuilddeps reports missing, out of debian/control, so
      # this file is not a second copy of that list.
      - name: install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            git ca-certificates dpkg-dev fakeroot \
            python3-build python3-setuptools python3-setuptools-scm

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Already inside the target being built for, so this takes the direct
      # path rather than starting a container of its own.
      - name: build
        run: ./packaging/build-deb.sh
        env:
          USE_CONTAINER: '0'
          DEB_TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.id }}
          path: dist/deb/*.deb
          if-no-files-found: error

  test-deb:
    name: tests, installed deb (${{ matrix.target }})
    needs: deb
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debian:trixie
            image: docker.io/library/debian:trixie
            id: debian-trixie
          - target: ubuntu:26.04
            image: docker.io/library/ubuntu:26.04
            id: ubuntu-26.04
    steps:
      # Two that are not obvious, and both stop the job before a test runs.
      #
      # ca-certificates: the checkout below fetches over HTTPS and these images
      # ship no CA bundle, so git fails with "Problem with the SSL CA cert
      # (path? access rights?)". That is what kept this job red from the day it
      # was added -- it had never once reached a test. The build job above
      # installs it for the same reason.
      #
      # xauth: Fedora's Xvfb package pulls it in and Debian's does not, so
      # without it xvfb-run stops with `xauth command not found`.
      - name: install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            ca-certificates make git python3-pytest xvfb xauth \
            dbus-daemon dbus-bin \
            gnupg pass desktop-file-utils appstream-util libglib2.0-bin

      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: deb-${{ matrix.id }}
          path: dist/deb

      # apt rather than dpkg -i, so the dependency metadata is resolved rather
      # than assumed -- the same reason the RPM job uses dnf. Most of that
      # metadata is generated by dh_python3 out of the wheel, which makes it
      # exactly the kind of thing a build cannot check itself.
      - name: install it
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/deb/gtkpass_*.deb

      - name: what it dragged in
        run: dpkg-query -W -f='${Depends}\n' gtkpass

      # The same `make test` a developer runs, pointed at the interpreter the
      # package installed into. On Debian that is /usr/lib/python3/dist-packages
      # rather than a site-packages, which is the one place these packages
      # differ in a way anything can see.
      - name: the suite, against the installed deb
        run: make test PYTHON=python3

      - name: the installed package, in place
        run: ./scripts/headless-session.sh ./packaging/smoke-test-install.sh

  test-wheel:
    name: tests, installed wheel (fedora ${{ matrix.fedora }})
    needs: distribution
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ['43', '44']
    steps:
      # No uv and no dev environment: the point is to exercise the wheel a user
      # would install, not the working copy it was built from. make is here
      # because the suite is run through the Makefile target rather than a
      # second spelling of it; nothing it uses needs uv.
      - name: install dependencies
        run: |
          dnf -y --setopt=install_weak_deps=False install \
            make git-core python3-devel python3-gobject gtk4 libadwaita \
            gobject-introspection cairo-gobject glib2 \
            gnupg2 pass git-core desktop-file-utils \
            xorg-x11-server-Xvfb dbus-daemon

      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist

      # One target does the lot: a throwaway environment on the system
      # interpreter, the wheel installed into it, the check that what runs is
      # the installed copy and not the checkout, and the suite. It is the same
      # target a developer runs after `make build`, which is the point -- this
      # job used to be four hand-written steps that only existed here.
      - name: the suite, against the installed wheel
        run: make test-wheel

  test-rpm:
    name: tests, installed rpm (fedora ${{ matrix.fedora }})
    needs: rpm
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ['43', '44']
    steps:
      - name: install dependencies
        run: |
          dnf -y --setopt=install_weak_deps=False install \
            make git-core python3-pytest gtk4 libadwaita python3-gobject \
            gobject-introspection cairo-gobject glib2 \
            gnupg2 pass desktop-file-utils libappstream-glib \
            xorg-x11-server-Xvfb dbus-daemon

      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: rpm-fedora${{ matrix.fedora }}
          path: dist/rpm

      # dnf rather than rpm -i, so the dependency metadata is resolved rather
      # than assumed. A package that builds and cannot be installed is a package
      # whose Requires are wrong, and the build cannot see that.
      - name: install it
        run: dnf -y install ./dist/rpm/gtkpass-*.noarch.rpm

      - name: what it dragged in
        run: rpm -q --requires gtkpass

      # The same `make test` a developer runs, pointed at the interpreter the
      # RPM installed into rather than a development environment there is none
      # of here. The target compiles the schema and arranges the headless
      # session itself.
      - name: the suite, against the installed rpm
        run: make test PYTHON=python3

      # The suite covers the code; this covers where the package put it --
      # the launcher on PATH, the schema in the system cache, the desktop files
      # where the shell looks. None of that is visible from inside a test run.
      - name: the installed package, in place
        run: ./scripts/headless-session.sh ./packaging/smoke-test-install.sh

  windows:
    name: windows executable and installer
    needs: distribution
    runs-on: windows-latest
    # Non-blocking, deliberately and for now. Everything this job depends on
    # comes from off this repository -- a gvsbuild release archive, an Inno
    # Setup that happens to be on the runner image -- and none of it is under
    # the control of the person whose release would be held up by it. The
    # release attaches whatever this produced and says nothing when it produced
    # nothing. Take this line out once the job has been boring for a while;
    # docs/WINDOWS.md records the reasoning so removing it is a decision rather
    # than an oversight.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The interpreter the gvsbuild wheels were built for. build.ps1 refuses
      # to continue on any other, so this pin and the one in that script are
      # the same fact written twice and have to move together.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 300 MB of GTK, libadwaita and their dependencies, fetched from a
      # GitHub release. Cached on the archive rather than the unpacked tree:
      # restoring one file beats restoring fifteen thousand.
      - name: cache the GTK stack
        uses: actions/cache@v4
        with:
          path: build/windows/GTK4_Gvsbuild_*.zip
          key: gvsbuild-2026.8.0-x64

      # The wheel the distribution job built -- the one the Linux jobs install
      # and the release publishes. Building a second one here would put
      # something inside the Windows bundle that no other job ever ran.
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/upstream

      - name: build
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/upstream/gtk_pass_ng-*.whl | Select-Object -First 1
          ./packaging/windows/build.ps1 -Wheel $wheel.FullName

      # The counterpart of the smoke test the RPM job runs: resources that did
      # not travel, a schema that never reached the compiled cache, entry
      # points resolving to nothing. It runs inside the bundle because that is
      # the only interpreter there is; see the launcher.
      - name: the bundle works
        shell: pwsh
        run: ./packaging/windows/smoke-test.ps1

      # And again on what the installer put on disk, which is a different
      # question from what the build produced -- a file left out of the [Files]
      # section is invisible until something runs from the install directory.
      - name: install it, then check what was installed
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/windows/*-setup.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'gtkpass-installed'
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target"
          if (-not (Test-Path "$target\gtkpass.exe")) {
            throw "the installer reported success and installed nothing to $target"
          }
          ./packaging/windows/smoke-test.ps1 -BundleDir $target
          Start-Process -Wait -FilePath "$target\unins000.exe" -ArgumentList '/VERYSILENT'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/windows/*.zip
            dist/windows/*-setup.exe
          if-no-files-found: error

  sysext:
    name: sysext image (fedora ${{ matrix.fedora }})
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    # Takes the RPM from that job rather than building one here, and this is not
    # only to save the work. build-sysext.sh decides what to vendor by asking
    # the running system what it lacks, and a build dependency installed here is
    # indistinguishable from something the target already ships: building the
    # RPM in this container would pull in python3-gnupg, and the image would
    # then leave it out and reach a real Fedora with its Direct GPG backend
    # reporting unavailable. Keeping the build out of this job keeps the answer
    # honest.
    needs: rpm
    strategy:
      fail-fast: false
      matrix:
        fedora: ['43', '44']
    steps:
      # Every one of these jobs starts from a bare Fedora and installs its
      # tools before it can do anything, and dnf5 deletes the packages once it
      # has, so the next run downloads them all again. Keeping them and letting
      # the cache carry them between runs turns that into a copy.
      #
      # The key is unique per run and the restore key is the prefix, which is
      # the rolling form: every run restores the newest cache there is and
      # saves an updated one. Keyed on a hash of the package lists would be
      # tidier, but these steps have to come before the checkout -- the
      # checkout needs git-core, which is one of the packages -- and hashFiles
      # over an empty workspace returns the empty string, which would collapse
      # the key to a constant and never notice a list changing again.
      - name: keep downloaded packages
        run: echo "keepcache=True" >> /etc/dnf/dnf.conf

      - name: cache the packages
        uses: actions/cache@v4
        with:
          path: /var/cache/libdnf5
          key: dnf-${{ matrix.fedora }}-${{ github.run_id }}
          restore-keys: dnf-${{ matrix.fedora }}-

      # selinux-policy-targeted and libselinux-utils are not here to enforce
      # anything -- this runner has no SELinux to enforce it. They are the
      # file_contexts and the lookup tool build-sysext.sh needs to work out what
      # every path in the image should be labelled, which it writes into the
      # image itself rather than copying off the build machine. A runner with no
      # SELinux cannot label its own filesystem at all, so without these the
      # image ships unlabelled and relabels /usr/lib on every host that merges
      # it. Issue #23.
      - name: install assembly tools
        run: |
          dnf -y --setopt=install_weak_deps=False install \
            git-core squashfs-tools cpio glib2 'dnf-command(download)' \
            selinux-policy-targeted libselinux-utils

      # What the image is for has to resemble what resolves it. These are the
      # packages a GNOME desktop base image has, so installing them makes the
      # answer here the one a Silverblue or Bluefin host would give -- for a few
      # hundred megabytes rather than the several gigabytes those images cost to
      # pull. If the list drifts from what they ship, the manifest written into
      # the image says so and the size ceiling in inspect-sysext.sh fails the
      # job rather than letting an image quietly carry the desktop's own GTK.
      - name: install what a desktop base image provides
        run: |
          dnf -y --setopt=install_weak_deps=False install \
            gtk4 libadwaita python3-gobject python3-secretstorage gnupg2 pass

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/download-artifact@v4
        with:
          name: rpm-fedora${{ matrix.fedora }}
          path: dist/rpm

      - name: build
        run: ./packaging/build-sysext.sh
        env:
          USE_CONTAINER: '0'

      # Merging it is not possible here -- systemd-sysext needs a running
      # systemd and a writable /run, and a container has neither. What can be
      # checked is that the image says what it should and carries what it
      # should; the merge is what packaging/test-sysext.sh is for.
      - name: inspect the image
        run: ./packaging/inspect-sysext.sh dist/sysext/*.raw

      # The canary for the contamination described above. python3-gnupg is the
      # one runtime dependency a Fedora desktop does not ship, so it has to
      # travel inside the image; an empty manifest means the resolver was asked
      # on a machine that already had it. Should Fedora ever ship it in the
      # desktop base, this check is the thing to delete.
      - name: the dependency the base lacks travelled with it
        run: |
          unsquashfs -cat dist/sysext/*.raw \
            usr/share/gtkpass/sysext-manifest.txt | grep -q python3-gnupg \
            || { echo "python3-gnupg was not vendored; see the job comment"; exit 1; }

      # Targeted at `fedora <release>`, this being what built it. An image for a
      # derivative names that derivative and is built on it -- `make sysext` on
      # the machine it is for, which is also the only place it can be merged and
      # actually tried. See docs/PACKAGING.md.
      - uses: actions/upload-artifact@v4
        with:
          name: sysext-fedora${{ matrix.fedora }}
          path: dist/sysext/*.raw
          if-no-files-found: error
