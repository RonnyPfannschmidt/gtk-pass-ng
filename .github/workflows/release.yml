# Cutting a release.
#
# Pushing a v* tag builds everything, checks it, publishes the wheel and sdist
# to PyPI, and attaches the RPMs and sysext images to a GitHub release. See
# docs/RELEASING.md, which also covers the one-time PyPI setup this needs.
#
# Running it by hand (workflow_dispatch) builds and checks everything and
# uploads the artefacts to the run, but publishes nothing. That is the dry run:
# publishing is guarded on the ref being a tag, in every job that does it, so a
# manual run cannot release by accident.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The whole of CI: lint, types, the suite on two Fedora releases, and the RPM
  # and sysext jobs -- which install and inspect what they build. Everything
  # below waits for this, and the packages it uploads are what gets published.
  verify:
    uses: ./.github/workflows/ci.yml

  pypi:
    name: publish to PyPI
    # The wheel CI built and ran the suite against, rather than a fresh one
    # nobody tested. Publishing a second build of the same commit would be
    # publishing something no job ever installed.
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI verifies this workflow's identity through OIDC,
    # so there is no API token to store, leak or rotate. The environment is what
    # PyPI's publisher configuration names, and what a protection rule would
    # attach to. docs/RELEASING.md has the setup.
    environment:
      name: pypi
      url: https://pypi.org/p/gtk-pass-ng
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist

      # The version is derived, so this is where a wrong one becomes visible. A
      # tag that is not on the built commit yields 0.2.0.dev3+g1234567, which
      # would otherwise be published as a perfectly valid and completely wrong
      # release -- and PyPI does not allow taking a version back.
      - name: the version matches the tag
        run: |
          tag=${GITHUB_REF#refs/tags/v}
          built=$(ls dist/*.tar.gz | sed -E 's|.*/gtk_pass_ng-(.*)\.tar\.gz|\1|')
          echo "tag=$tag built=$built"
          test "$tag" = "$built" || {
            echo "::error::built $built from tag $tag; the tag is not on this commit"
            exit 1
          }

      # skip-existing so re-running a release does what re-running should: the
      # packages that failed to attach get attached, and the version already on
      # PyPI is left alone rather than failing the run. A version cannot be
      # re-uploaded there in any case, so this only changes whether the job is
      # red about it.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: attach packages to the release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Everything the run built, including the artefacts uploaded by the
      # reusable CI workflow -- the same files that were installed and inspected
      # there, rather than a second build nobody checked.
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: collect what to publish
        run: |
          mkdir -p upload
          find artefacts -name '*.rpm' -exec cp {} upload/ \;
          find artefacts -name '*.raw' -exec cp {} upload/ \;
          find artefacts -name '*.tar.gz' -o -name '*.whl' \
            | xargs -r -I{} cp {} upload/
          ls -1 upload/

      # What changed, and where to read about the rest. Install instructions
      # belong in the documentation, where they are corrected when they go
      # wrong; a release's notes are frozen the moment they are written, so
      # anything copied into them is wrong from the next change onwards.
      - name: write the notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF#refs/tags/}
          previous=$(git tag --sort=-version:refname | grep -A1 -x "$tag" | tail -1)

          {
            if [ -n "$previous" ] && [ "$previous" != "$tag" ]; then
              git log --no-merges --pretty='- %s' "${previous}..${tag}"
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${tag}"
            else
              git log --no-merges --pretty='- %s' "$tag"
            fi
            echo
            echo '---'
            echo
            echo 'Installing: [README](https://github.com/'"${GITHUB_REPOSITORY}"'#running-it) ·' \
                 '[RPM and systemd-sysext](https://github.com/'"${GITHUB_REPOSITORY}"'/blob/'"$tag"'/docs/PACKAGING.md) ·' \
                 '[Flatpak](https://github.com/'"${GITHUB_REPOSITORY}"'/blob/'"$tag"'/docs/FLATPAK.md)'
            echo
            echo 'Nothing here is signed, and there is no repository to install from.'
          } > notes.md

          cat notes.md

      # Create the release, or attach to one that is already there.
      #
      # `gh release create` fails outright on an existing tag, and a release
      # made by hand before the workflow runs is not a mistake anyone makes
      # twice knowingly -- it just means the packages had nowhere to go, which
      # is what happened to v0.2.0. Re-running this on that tag now attaches
      # them.
      #
      # --clobber so a re-run replaces assets rather than failing on the second
      # attempt; the files are rebuilt from the same commit and are the same
      # files.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF#refs/tags/}

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists; attaching packages to it"
            gh release upload "$tag" --clobber upload/*
          else
            echo "creating release $tag"
            gh release create "$tag" \
              --title "$tag" \
              --notes-file notes.md \
              upload/*
          fi
