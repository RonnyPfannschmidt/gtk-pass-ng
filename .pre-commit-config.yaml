# See https://pre-commit.com for more information
#
# Lint, format and type checking live here rather than in bespoke CI jobs, so
# that what runs locally and what runs on a pull request cannot drift apart.
# CI runs `pre-commit run --all-files` plus the things pre-commit cannot do:
# execute the suite under a display, verify .blp/.ui are in sync, check the wheel.
#
# The ruff version below is pinned and must match the `dev` dependency group in
# pyproject.toml.
ci:
  autofix_prs: true
  # Monthly is what left a bump PR open for seven months.
  autoupdate_schedule: quarterly
  autoupdate_commit_msg: "chore: pre-commit autoupdate"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The .ui files are blueprint-compiler output and are byte-for-byte
      # compared against a fresh compile in CI. blueprint-compiler emits no
      # trailing newline, so "fixing" one here would break that check forever.
      - id: trailing-whitespace
        exclude: ^src/gtkpass/ui/blueprints/.*\.ui$
      - id: end-of-file-fixer
        exclude: ^src/gtkpass/ui/blueprints/.*\.ui$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: debug-statements
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        # This hook runs in its own environment, which has no PyGObject in it.
        # It works anyway because pyproject.toml declares ignore_missing_imports
        # for gi.*, so mypy treats the bindings as Any and still checks our code.
        # pytest is pure Python and installs here happily; without it, things
        # like pytest.skip() lose their NoReturn typing and the tests type check
        # against Any.
        additional_dependencies: [pytest]
        # mypy resolves its own file list from pyproject.toml.
        pass_filenames: false
