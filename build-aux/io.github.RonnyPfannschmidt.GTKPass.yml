# Flatpak manifest for GTKPass. `make flatpak` builds and installs it.
#
# docs/FLATPAK.md justifies every permission below, and records what was
# rejected and why.
app-id: io.github.RonnyPfannschmidt.GTKPass
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: gtkpass

finish-args:
  # Display and input.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # The store. :create because adding the first entry has to make it.
  # A store kept elsewhere needs --filesystem=/path/to/store.
  - --filesystem=~/.password-store:create

  # Decryption runs in the host's gpg-agent, so no private key and no
  # passphrase ever enters the sandbox.
  - --socket=gpg-agent

  # gpg resolves recipients by name from the public keyring. Only these three
  # files, read-only -- not ~/.gnupg, which is where the private keys are.
  - --filesystem=~/.gnupg/pubring.kbx:ro
  - --filesystem=~/.gnupg/public-keys.d/pubring.db:ro
  - --filesystem=~/.gnupg/common.conf:ro

  # The Secret Service backend talks to the session keyring.
  - --talk-name=org.freedesktop.secrets

  # Without it git has no author identity and refuses to commit, which every
  # write to a git-backed store does. xdg-config/git rather than ~/.gitconfig:
  # only this one leaves an `includeIf gitdir:` chain able to find its files.
  - --filesystem=xdg-config/git:ro

  # A packaged build is the application actually being used, so it opts in to
  # the store guard in src/gtkpass/safety.py.
  - --env=GTKPASS_ALLOW_REAL_STORE=1

  # Sync is opt-in, per user: most stores have no remote, and network access
  # plus an agent socket is not a default a password manager should hold.
  # sandbox.py checks for these and the sync action shows the command:
  #
  #   flatpak override --user --socket=ssh-auth --share=network \
  #       io.github.RonnyPfannschmidt.GTKPass
  #
  # An ssh remote needs its Host aliases and host keys as well, or it fails
  # with "Could not resolve hostname" and host key verification respectively:
  #
  #   flatpak override --user --filesystem=~/.ssh/config:ro \
  #       --filesystem=~/.ssh/known_hosts:ro io.github.RonnyPfannschmidt.GTKPass
  #
  # Never granted: --talk-name=org.freedesktop.Flatpak, which is arbitrary
  # command execution on the host; the whole of ~/.ssh, which is the private
  # keys; --filesystem=home or host.

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'

modules:
  # The only runtime dependency the GNOME runtime does not already carry.
  - name: python3-gnupg
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --prefix=${FLATPAK_DEST} .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/42/d0/72a14a79f26c6119b281f6ccc475a787432ef155560278e60df97ce68a86/python-gnupg-0.5.5.tar.gz
        sha256: 3fdcaf76f60a1b948ff8e37dc398d03cf9ce7427065d583082b92da7a4ff5a63
        x-checker-data:
          type: pypi
          name: python-gnupg

  # secretstorage is deliberately not bundled; the Secret Service backend
  # reports itself unavailable instead. See docs/FLATPAK.md.

  # `pass ls` runs `tree`, which the runtime does not have.
  - name: tree
    buildsystem: simple
    build-commands:
      - make PREFIX=${FLATPAK_DEST} MANDIR=${FLATPAK_DEST}/share/man install
    sources:
      - type: archive
        url: https://gitlab.com/OldManProgrammer/unix-tree/-/archive/2.3.2/unix-tree-2.3.2.tar.gz
        sha256: 513a53cbc42ca1f4ea06af2bab1f5283524a3848266b1d162416f8033afc4985

  # Not in the runtime, and a git-backed store commits on every write.
  # NO_RUST is required: git 2.55 builds libgitcore with cargo and the GNOME
  # SDK has no Rust toolchain. The other NO_ flags only trim the bundle.
  - name: git
    buildsystem: simple
    build-commands:
      - make configure
      - ./configure --prefix=${FLATPAK_DEST} --without-tcltk --with-curl
        --with-expat
      - make NO_RUST=1 NO_PERL=1 NO_PYTHON=1 NO_TCLTK=1
        -j$FLATPAK_BUILDER_N_JOBS all
      - make NO_RUST=1 NO_PERL=1 NO_PYTHON=1 NO_TCLTK=1 install
    sources:
      - type: archive
        url: https://www.kernel.org/pub/software/scm/git/git-2.55.0.tar.xz
        sha256: 457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357
        x-checker-data:
          type: html
          url: https://www.kernel.org/pub/software/scm/git/
          version-pattern: git-([0-9.]+)\.tar\.xz

  # A bash script over the runtime's gpg and ssh and the two modules above,
  # so it runs entirely inside the sandbox.
  - name: pass
    buildsystem: simple
    build-commands:
      - make PREFIX=${FLATPAK_DEST} WITH_BASHCOMP=no WITH_ZSHCOMP=no
        WITH_FISHCOMP=no install
    sources:
      - type: archive
        url: https://git.zx2c4.com/password-store/snapshot/password-store-1.7.4.tar.xz
        sha256: 4c2d0a8b99df8915a87099607a8d912fd05d30651b6f014745c14e4ca8dbbfb7

  - name: gtkpass
    buildsystem: simple
    build-options:
      env:
        # setuptools-scm reads git tags; the build sandbox has no repository.
        SETUPTOOLS_SCM_PRETEND_VERSION: '0.1.0'
    build-commands:
      - pip3 install --verbose --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      # Flathub requires the licence to be installed here.
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/LICENSE
      - install -Dm644 data/${FLATPAK_ID}.desktop
        ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 data/${FLATPAK_ID}.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
        ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      # GLib reads the compiled blob, and an uncompiled schema aborts the
      # process on the first settings lookup.
      - install -Dm644 data/${FLATPAK_ID}.gschema.xml
        ${FLATPAK_DEST}/share/glib-2.0/schemas/${FLATPAK_ID}.gschema.xml
      - glib-compile-schemas ${FLATPAK_DEST}/share/glib-2.0/schemas
    sources:
      - type: dir
        path: ..
