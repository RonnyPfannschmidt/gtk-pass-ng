[project]
name = "gtkpass"
description = "A GTK4/Libadwaita frontend for pluggable password backends"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Ronny Pfannschmidt", email = "opensource@ronnypfannschmidt.de"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dynamic = ["version"]
dependencies = [
    "PyGObject>=3.42.0",
    "secretstorage>=3.3.0",
    "python-gnupg>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/RonnyPfannschmidt/gtkpass"
Issues = "https://github.com/RonnyPfannschmidt/gtkpass/issues"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0.0",
    "mypy>=1.0.0",
    "ruff==0.14.10",
    "blueprint-compiler>=0.22.2",
    "pre-commit>=4.0.0",
]

[project.scripts]
gtkpass = "gtkpass.__main__:main"

[project.entry-points."gtkpass.backends"]
demo = "gtkpass.backends.demo:DemoBackend"
secretservice = "gtkpass.backends.secretservice:SecretServiceBackend"
pass = "gtkpass.backends.pass_cli:PassBackend"
direct = "gtkpass.backends.direct:DirectBackend"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "src/gtkpass/_version.py"

[tool.setuptools.packages.find]
where = ["src"]

# The .ui files and demo.json are loaded at runtime via importlib.resources;
# without these they are absent from the built wheel and the app fails on import.
[tool.setuptools.package-data]
"gtkpass.ui.blueprints" = ["*.ui", "*.blp"]
"gtkpass.backends.data" = ["*.json"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["src/gtkpass/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "examples"]
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# Ratchet target; the tree is not clean enough for this yet.
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["gi.*", "gnupg.*", "secretstorage.*"]
ignore_missing_imports = true

# Known debt: remove entries as these are repaired, do not add new ones.
[[tool.mypy.overrides]]
module = [
    "gtkpass.backends",
    "gtkpass.backends.demo",
    "gtkpass.backends.manager",
    "gtkpass.backends.pass_cli",
    "gtkpass.backends.secretservice",
    "gtkpass.ui.settings",
    "demo_backend_loading",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage is a CI concern; forcing it here makes pytest-cov a hard dependency
# of running a single test and writes htmlcov/ on every invocation.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
xfail_strict = true
markers = [
    "gui: Requires a display (run under xvfb)",
    "slow: Slow running tests",
    "requires_gpg: Needs a working gpg binary",
    "requires_pass: Needs the pass CLI",
    "requires_git: Needs a git binary",
]
